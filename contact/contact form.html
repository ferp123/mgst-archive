
<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <header>
    <nav class="nav">
      <div class="header-container">
        <div class="header-b1">
          <a href="../index.html">
          <button>home</button></a>
        </div>
        <div class="header-b2">
            <a href="contact form.html">

        </div>
        <div class="header-b3">
          <a href="../about/about.html">
          <button>about</button></a>
        </div>
      </div>
    </nav>

</header>

<main class="main_contact">


    <div class="contact-container">
        <div class="contact-box">
            <div class="left"></div>
            <div class="right">
                <h2>Ta kontakt</h2>

                <form action="#" method="POST" />
                <input type="text" name="name" class="field" placeholder="Your Name" required>
                <input type="email" name="email" class="field" placeholder="Your Email" required>
                <input type="text" name="phone" class="field" placeholder="Your Number">
                <textarea class="field area" name="Msg" placeholder="Message"></textarea>

                <button type="submit" class="btn">send</button>
                
                <input type="hidden" name="_subject" value="MGST - ny melding!">
                <input type="hidden" name="_next" value="https://mgst.no">
                <input type="hidden" name="_captcha" value="false">
            </form>


            </div>
        </div>
    </div>


</main>


<footer>
  <div class="footer">
    <div class="footer-container">
      <div class="footer-item footer-b1">
        <a href="http://www.instagram.com/martingrotlien" target="_blank"><i class="fab
          fa-instagram"></i></a>

      </div>
      <div class="footer-item footer-b2">
          <a href="http://www.facebook.com/martingrotlien" target="_blank"><i class=" 
            fab fa-facebook"></i></a>
      </div>
      <div class="footer-item footer-b3">
        <a href="mailto:post@mgst.no" target="_blank"><i class="fa fa-envelope"></i></a>
      </div>
    </div>
  </div>
</footer>

</body>
